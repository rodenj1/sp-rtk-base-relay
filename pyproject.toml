[project]
name = "sp-rtk-base-relay"
version = "3.1.1"
description = "RTCM relay service for custom GPS correction servers"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "John Roden", email = "rodenj@gmail.com" }
]
license = {text = "MIT"}
keywords = ["rtcm", "gps", "gnss", "rtk", "base-station", "corrections"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: System :: Networking",
]

dependencies = [
    "pyserial>=3.5",
    "pyyaml>=6.0",
    "prometheus-client>=0.17.0",
    "dbus-fast>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "mypy>=1.5.0",
    "types-PyYAML",
    "ruff>=0.6.0",
    "pylint>=2.17.0",
    "pre-commit>=3.0.0",
    "commitizen>=4.0.0",
]

[project.scripts]
sp-rtk-base-relay = "sp_rtk_base_relay.main:main"

[project.urls]
Homepage = "https://github.com/rodenj1/sp-rtk-base-relay"
Documentation = "https://github.com/rodenj1/sp-rtk-base-relay#readme"
Repository = "https://github.com/rodenj1/sp-rtk-base-relay"
Issues = "https://github.com/rodenj1/sp-rtk-base-relay/issues"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "--cov=src/sp_rtk_base_relay",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-fail-under=70",
    "--strict-markers",
    "--strict-config",
]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
norecursedirs = ["integration", "manual"]

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "*/tests/*",
    "*/test_*",
    "conftest.py"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "serial.*",
    "prometheus_client.*",
    "dbus_fast.*",
]
ignore_missing_imports = true

# dbus-fast uses dynamic __getattr__ on ProxyInterface to create call_*
# methods at runtime — pyright (our canonical strict checker per
# .clinerules) accepts this pattern, but mypy cannot. We relax mypy's
# strict checks for the Bluetooth modules that consume dbus-fast so
# both type-checkers can pass. pyright continues to enforce strict
# typing on these files.
[[tool.mypy.overrides]]
module = [
    "sp_rtk_base_relay.core.bluetooth_manager",
    "sp_rtk_base_relay.core.input_sources.bluetooth_input",
]
warn_unused_ignores = false
warn_return_any = false
disable_error_code = ["attr-defined", "union-attr"]

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = [
    "docs",
    "examples",
    "tools",
    "htmlcov",
    "build",
    "dist",
    ".venv",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade (enforces modern Python 3.10+ syntax)
    "N",    # pep8-naming
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",  # line length (handled by formatter)
    # --- Legacy baseline (TODO: address in follow-up PRs, then remove) ---
    "B904",    # raise ... from err inside except
    "E722",    # bare except
    "RUF002",  # ambiguous unicode character in docstring
    "RUF003",  # ambiguous unicode character in comment
    "RUF012",  # mutable class defaults should use ClassVar
    "RUF043",  # pytest.raises(match=...) should use raw string / re.escape
    "RUF059",  # unused unpacked variable (test helpers)
    "SIM102",  # collapsible if
    "SIM105",  # use contextlib.suppress
    "SIM116",  # if/else chain could be dict lookup
    "E741",    # ambiguous variable name (single-letter in tests)
    "F841",    # unused local variable (test scaffolding)
    "W293",    # blank line with whitespace (rare edge cases in multi-line strings)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B", "N", "SIM"]
"conftest.py" = ["B", "N"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pyright]
include = ["src"]
exclude = ["**/node_modules", "**/__pycache__"]
typeCheckingMode = "strict"
deprecateTypingAliases = true
reportUnusedParameter = "warning"
reportDeprecated = "warning"
extraPaths = ["src/"]

[dependency-groups]
dev = [
    "pylance>=0.38.3",
    "pyright>=1.1.407",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.6.0",
    "mypy>=1.5.0",
    "pylint>=2.17.0",
    "pre-commit>=3.0.0",
    "commitizen>=4.0.0",
]

# Commitizen — enforces Conventional Commits 1.0.0 on commit messages
# via the pre-commit hook configured in .pre-commit-config.yaml.
# Also drives `uv run cz bump` for SemVer-aware version + changelog
# automation (optional; the release workflow doesn't depend on it).
#
# Conventional Commits spec: https://www.conventionalcommits.org/en/v1.0.0/
#
# We use `cz_customize` (not `cz_conventional_commits`) so we can extend
# the default Angular type list with `release` and `security`, both of
# which we use in practice.  The Conventional Commits spec explicitly
# permits projects to define their own type vocabulary.
[tool.commitizen]
name = "cz_customize"
version = "2.1.2"
version_provider = "pep621"

version_files = [
    "src/sp_rtk_base_relay/__init__.py:__version__",
]
tag_format = "v$version"
update_changelog_on_bump = true
major_version_zero = false
# Lines that bypass the schema check (merge commits, manual reverts,
# fixup/squash markers used during rebase).
allowed_prefixes = [
    "Merge",
    "Revert",
    "Pull request",
    "fixup!",
    "squash!",
]
bump_message = "release: bump $current_version -> $new_version"

[tool.commitizen.customize]
# Conventional Commits 1.0.0 header pattern:
#   <type>(<scope>)?!?: <subject>
#
# Allowed types: feat, fix, docs, style, refactor, perf, test, build,
#                ci, chore, revert, release, security.
# Scope: optional, lowercase identifier (a-z0-9_-, dots, slashes,
#        commas for multi-scope).
# Optional `!` after type/scope marks a breaking change.
# Subject: at least one character.
#
# Verified at commit-msg time by the `commitizen` pre-commit hook.
message_template = "{{change_type}}{% if scope %}({{scope}}){% endif %}: {{subject}}"
schema = "<type>(<scope>): <subject>"
schema_pattern = "^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert|release|security)(\\([a-z0-9_\\-.,/]+\\))?!?: .+"
bump_pattern = "^(feat|fix|perf|refactor|release)"
# SemVer bump policy when `cz bump` is used:
#   BREAKING CHANGE / `!` -> MAJOR
#   feat                  -> MINOR
#   everything else above -> PATCH
bump_map = {"BREAKING CHANGE" = "MAJOR", "feat" = "MINOR", "fix" = "PATCH", "perf" = "PATCH", "refactor" = "PATCH", "release" = "PATCH"}
change_type_order = ["BREAKING CHANGE", "feat", "fix", "security", "perf", "refactor", "release", "docs", "test", "build", "ci", "chore"]
info = """
Allowed commit types: feat, fix, docs, style, refactor, perf, test,
build, ci, chore, revert, release, security.

Format: <type>(<optional-scope>): <short subject in imperative mood>

See CONTRIBUTING.md and https://www.conventionalcommits.org/en/v1.0.0/
"""
